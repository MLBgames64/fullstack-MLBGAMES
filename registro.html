<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link rel="stylesheet" href="style.css">
</head>


<body>
    
    <div class="tarjeta">
        <h1>Crear cuenta</h1>

        <form class="formulario">
            <label for="nombre" class="texto-campo">Nombre:</label>
            <input type="text" id="nombre" class="campo">

            <label for="contrasena" class="texto_contra">Contraseña:</label>
            <input type="password" id="contrasena" class="campo">

            <label for="email" class="texto_email">Email:</label>
            <input type="email" id="email" class="campo">

            <button type="submit" class="boton">Registrarme</button>
        </form>
    </div>

</body>
</html>
