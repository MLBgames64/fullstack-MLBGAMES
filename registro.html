<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link rel="stylesheet" href="style.css">
</head>


<body>
    <header>
        <h1>Registro</h1>
        <nav>
            <ul>
            <li><a href="index.html">Inicio</a></li>
            <li><a href="inicioSesion.html">Inicio Sesion</a></li>
            </ul>
        </nav>
    </header>

    
    <div class="tarjeta">
        <h1>Crear cuenta</h1>

        <form class="formulario" id="registro">
            <label for="nombre" class="texto-campo">Nombre:</label>
            <input type="text" id="nombre" class="campo">

            <label for="contrasena" class="texto_contra">Contrasena:</label>
            <input type="password" id="contrasena" class="campo">

            <label for="email" class="texto_email">Email:</label>
            <input type="email" id="email" class="campo">

            <button type="submit" class="boton">Registrarme</button>
        </form>
    </div>
    <script src="script.js"></script>
</body>
</html>
